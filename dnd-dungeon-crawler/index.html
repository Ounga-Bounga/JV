<title>La Crypte aux Treize Voies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100d0a;
  --bg-elevated:#181310;
  --surface:#221b14;
  --surface-2:#2b2118;
  --surface-3:#352819;
  --ink:#ece0c4;
  --ink-dim:#a3906f;
  --ink-faint:#6f5f47;
  --border:rgba(236,224,196,0.13);
  --border-strong:rgba(236,224,196,0.24);
  --accent:#d99a3f;
  --accent-bright:#f3b968;
  --accent-ink:#241505;
  --gold:#e2bb6a;
  --good:#7fae7a;
  --bad:#c1495a;
  --role-tank:#7fa0c2;
  --role-melee:#c1495a;
  --role-ranged:#6fa36c;
  --role-healer:#d8c98a;
  --role-support:#b087cf;
  --role-caster:#7f92e0;
  --enemy-common:#c1495a;
  --enemy-elite:#a56bd6;
  --enemy-boss:#f0a556;
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,0.65);
  --shadow-md:0 10px 26px -12px rgba(0,0,0,0.55);
  --radius:10px;
  --font-display:'Cinzel',Georgia,'Times New Roman',serif;
  --font-body:'Spectral',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono','Consolas',monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 700px at 12% -10%, rgba(217,154,63,0.08), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(127,146,224,0.06), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:0.02em;text-wrap:balance;margin:0;color:var(--ink);}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;}

#app{min-height:100vh;display:flex;flex-direction:column;}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 48px;width:100%;}
.scroller{overflow-x:auto;}

/* ---- generic buttons ---- */
.btn{
  appearance:none;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink);
  padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;letter-spacing:0.01em;
  transition:transform .12s ease, background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--accent);transform:translateY(-1px);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:0.38;cursor:not-allowed;}
.btn:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;}
.btn-primary{background:linear-gradient(180deg, var(--accent-bright), var(--accent));color:var(--accent-ink);border-color:var(--accent);font-weight:700;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(180deg, var(--accent-bright), var(--accent));}
.btn-danger{border-color:rgba(193,73,90,0.5);color:#f0b9be;}
.btn-danger:hover:not(:disabled){background:rgba(193,73,90,0.16);border-color:var(--bad);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-dim);}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;border:1px solid var(--border-strong);color:var(--ink-dim);}
.tag-role{border:none;color:var(--accent-ink);}

/* ---- topbar ---- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(16,13,10,0.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);padding:10px 20px;
}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.topbar-brand{font-family:var(--font-display);font-size:15px;color:var(--accent-bright);white-space:nowrap;}
.topbar-party{display:flex;gap:10px;flex:1;flex-wrap:wrap;}
.tb-card{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:150px;}
.tb-body{flex:1;min-width:0;}
.tb-name{font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:3px;}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s ease;}
.bar-hp>i{background:linear-gradient(90deg,#7fae7a,#a7cf85);}
.bar-hp.low>i{background:linear-gradient(90deg,#c1495a,#e07f7f);}
.bar-focus>i{background:linear-gradient(90deg,#7f92e0,#a6b4f2);}
.bar-caption{font-size:10px;color:var(--ink-faint);margin-top:2px;letter-spacing:.02em;}
.tb-ko{color:var(--bad);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.topbar-meta{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:13px;color:var(--gold);white-space:nowrap;}
.help-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink-dim);font-weight:700;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;font-size:13px;}
.help-btn:hover{border-color:var(--accent);color:var(--accent-bright);}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,6,4,0.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:22px 26px;max-width:560px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:19px;}
.help-section{margin-bottom:14px;}
.help-section h4{font-size:14px;margin-bottom:4px;color:var(--accent-bright);}
.help-section p{font-size:13px;color:var(--ink-dim);line-height:1.55;margin:0;}
.help-credits{font-size:11px;color:var(--ink-faint);border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
.help-credits a{color:var(--ink-dim);}
@media (prefers-reduced-motion:reduce){.modal-backdrop{animation:none;}}

/* ---- title screen ---- */
.title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:40px 20px;gap:28px;}
.title-emblem{font-size:52px;filter:drop-shadow(0 6px 18px rgba(217,154,63,0.35));}
.title-h1{font-size:clamp(30px,5vw,52px);font-weight:900;color:var(--ink);}
.title-h1 span{color:var(--accent-bright);}
.title-sub{max-width:520px;color:var(--ink-dim);font-size:15.5px;font-style:italic;}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.title-meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}

/* ---- class builder ---- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:22px;}
.section-head p{color:var(--ink-dim);margin:2px 0 0;font-size:13.5px;}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.class-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;}
.class-card:hover{border-color:var(--border-strong);}
.class-card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset, var(--shadow-md);}
.class-card.disabled{opacity:0.42;}
.cc-head{display:flex;align-items:center;gap:10px;}
.cc-name{font-family:var(--font-display);font-size:15.5px;font-weight:700;}
.cc-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);text-align:center;}
.cc-stats b{display:block;color:var(--ink);font-size:13px;}
.cc-abilities{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-dim);}
.cc-abilities .ab-name{color:var(--ink);font-weight:600;}
.cc-feat{font-size:11.5px;color:var(--accent-bright);border-top:1px dashed var(--border);padding-top:7px;}
.cc-pick{margin-top:auto;}
.roster-strip{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.roster-slot{flex:1;min-width:130px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:8px;padding:10px;text-align:center;color:var(--ink-faint);font-size:12px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.roster-slot.filled{border-style:solid;color:var(--ink);}
.roster-slot .rs-icon{font-size:22px;}

/* ---- map ---- */
.map-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.map-svg-wrap{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 30px;min-width:760px;}
.node-btn{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface-2);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .15s ease;}
.node-btn .nb-lvl{position:absolute;bottom:-16px;font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);}
.node-btn.available{border-color:var(--accent);box-shadow:0 0 0 4px rgba(217,154,63,0.15);cursor:pointer;}
.node-btn.available:hover{transform:translate(-50%,-50%) scale(1.08);background:var(--surface-3);}
.node-btn.visited{opacity:0.5;}
.node-btn.current{border-color:var(--accent-bright);box-shadow:0 0 0 5px rgba(217,154,63,0.28);}
.node-btn.locked{opacity:0.3;cursor:default;}
.node-btn.boss{width:74px;height:74px;background:linear-gradient(180deg,#3a1a20,#221114);border-color:var(--bad);}
.party-token{position:absolute;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--surface-2);border:2px solid var(--accent);border-radius:8px;padding:4px;box-shadow:var(--shadow-md);font-size:13px;z-index:5;pointer-events:none;transform:translate(-50%,-100%);}
.party-token span{width:15px;height:15px;display:flex;align-items:center;justify-content:center;}
.token-idle{animation:tokenBob 1.8s ease-in-out infinite;}
.token-moving{animation:tokenWalk var(--dur,0.5s) ease forwards;}
@keyframes tokenBob{0%,100%{transform:translate(-50%,-100%) translateY(0);}50%{transform:translate(-50%,-100%) translateY(-4px);}}
@keyframes tokenWalk{from{transform:translate(-50%,-100%) translate(0,0);}to{transform:translate(-50%,-100%) translate(var(--dx),var(--dy));}}
@media (prefers-reduced-motion:reduce){.token-idle,.token-moving{animation:none;}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--ink-dim);}
.legend span{display:inline-flex;align-items:center;gap:6px;}

/* ---- avatars ---- */
.avatar{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 33% 28%, var(--surface-3), var(--surface-2));border:2px solid var(--avatar-color,var(--border-strong));color:var(--avatar-color,var(--ink-dim));box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset, 0 2px 6px rgba(0,0,0,0.3);}
.icon-svg{width:56%;height:56%;fill:currentColor;display:block;}
.avatar-xl{width:72px;height:72px;}
.avatar-lg{width:50px;height:50px;}
.avatar-md{width:40px;height:40px;}
.avatar-sm{width:30px;height:30px;}
.avatar-fallback{font-size:13px;color:var(--ink-dim);}
@keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}

/* ---- combat ---- */
.combat-shell{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px;}
@media(max-width:820px){.combat-shell{grid-template-columns:1fr;}}
.combat-side h3{font-size:13px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-dim);margin-bottom:8px;}
.floater{position:absolute;top:2px;right:10px;font-family:var(--font-mono);font-weight:700;font-size:13px;padding:1px 7px;border-radius:6px;background:var(--bg-elevated);pointer-events:none;animation:floatUp 1.1s ease forwards;z-index:6;}
.floater.dmg{color:var(--bad);}
.floater.dmg.crit{color:#fff;background:var(--bad);font-size:15px;}
.floater.heal{color:var(--good);}
.floater.status,.floater.buff{color:var(--accent-bright);font-size:11px;}
.floater.dodge{color:var(--ink-dim);font-style:italic;}
@keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(6px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}75%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-22px);}}
@media (prefers-reduced-motion:reduce){.floater{animation:none;opacity:1;}}
.uc-effects{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.eff{font-size:9.5px;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--border);}
.eff.buff{color:var(--good);}
.eff.debuff{color:var(--bad);}
.init-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:9px;}
.init-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-right:4px;}
.init-chip{width:32px;height:32px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;opacity:0.45;padding:6px;}
.init-chip .icon-svg{width:70%;height:70%;}
.init-chip.now{opacity:1;background:var(--accent);box-shadow:0 0 0 2px var(--accent-bright);}
.action-panel{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.ap-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.last-action-banner{background:var(--bg-elevated);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:8px 12px;font-size:13px;color:var(--ink);margin-bottom:12px;animation:bannerIn .3s ease;}
.last-action-banner.hit{border-color:var(--bad);}
.last-action-banner.heal{border-color:var(--good);}
.last-action-banner.info{border-color:var(--accent-bright);font-style:italic;color:var(--ink-dim);}
@keyframes bannerIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
@media (prefers-reduced-motion:reduce){.last-action-banner{animation:none;}}
.ability-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- battle stage (JRPG-style) ---- */
.battle-stage{position:relative;aspect-ratio:16/8;min-height:260px;border-radius:14px;overflow:hidden;border:3px solid var(--border-strong);box-shadow:var(--shadow-lg);margin-bottom:16px;
  background:radial-gradient(120% 90% at 50% 0%, rgba(217,154,63,0.10), transparent 62%), linear-gradient(180deg, #241a12 0%, #1a130d 48%, #100c08 100%);}
.battle-stage::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 44px);pointer-events:none;}
.battle-stage::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 80px 18px rgba(0,0,0,0.6);pointer-events:none;}
.stage-caption{position:absolute;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);z-index:2;}
.stage-caption.top{top:8px;left:12px;}
.stage-caption.bottom{bottom:8px;left:12px;}
.battle-sprite{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;}
.battle-sprite.ko{opacity:.35;filter:grayscale(.7);z-index:1;}
.avatar-battle{width:clamp(38px,8vw,64px);height:clamp(38px,8vw,64px);}
.battle-sprite:not(.ko):not(.acting) .avatar{animation:idleBob 2.4s ease-in-out infinite;}
.battle-sprite:nth-child(3n) .avatar{animation-delay:.3s;}
.battle-sprite:nth-child(4n) .avatar{animation-delay:.7s;}
.battle-sprite.acting::before{content:'▼';position:absolute;top:-20px;left:50%;transform:translateX(-50%);color:var(--accent-bright);font-size:13px;animation:markerBob .6s ease-in-out infinite;z-index:4;}
@keyframes markerBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(4px);}}
.battle-sprite.lunge-up{animation:lungeUp .45s ease;}
@keyframes lungeUp{0%,100%{transform:translate(-50%,-50%);}40%{transform:translate(-50%,-50%) translateY(-22px) scale(1.06);}}
.battle-sprite.lunge-down{animation:lungeDown .45s ease;}
@keyframes lungeDown{0%,100%{transform:translate(-50%,-50%);}40%{transform:translate(-50%,-50%) translateY(22px) scale(1.06);}}
.battle-sprite.casting .avatar{animation:castPulse .5s ease;}
@keyframes castPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.7) drop-shadow(0 0 10px var(--avatar-color));}}
.battle-sprite.hit-flash{animation:spriteShake .4s ease;}
@keyframes spriteShake{0%,100%{transform:translate(-50%,-50%);}20%{transform:translate(calc(-50% - 5px),-50%);}40%{transform:translate(calc(-50% + 5px),-50%);}60%{transform:translate(calc(-50% - 4px),-50%);}80%{transform:translate(calc(-50% + 4px),-50%);}}
.battle-sprite.hit-flash .avatar{box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset, 0 0 14px 2px var(--bad);}
.battle-sprite.heal-flash .avatar{animation:healGlowSprite .5s ease;}
@keyframes healGlowSprite{0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset, 0 0 0 0 transparent;}50%{box-shadow:0 0 0 1px rgba(0,0,0,0.35) inset, 0 0 16px 3px var(--good);}}
.battle-sprite.dying{animation:spriteFall .65s ease forwards;}
@keyframes spriteFall{0%{transform:translate(-50%,-50%) rotate(0);opacity:1;}100%{transform:translate(-50%,-50%) rotate(75deg) translateY(8px);opacity:.4;}}
@media (prefers-reduced-motion:reduce){.battle-sprite,.battle-sprite .avatar,.battle-sprite.lunge-up,.battle-sprite.lunge-down,.battle-sprite.hit-flash,.battle-sprite.heal-flash,.battle-sprite.dying,.battle-sprite.acting::before{animation:none;}}
.sprite-label{margin-top:4px;text-align:center;min-width:64px;}
.sprite-name{font-size:10.5px;font-weight:600;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,0.9);white-space:nowrap;}
.sprite-name .lvl{color:var(--ink-faint);font-weight:400;font-size:9px;}
.mini-bar{height:4px;width:56px;border-radius:99px;background:rgba(0,0,0,0.55);overflow:hidden;margin:2px auto 0;}
.mini-bar>i{display:block;height:100%;border-radius:99px;}
.mini-bar.hp>i{background:linear-gradient(90deg,#7fae7a,#a7cf85);}
.mini-bar.hp.low>i{background:linear-gradient(90deg,#c1495a,#e07f7f);}
.mini-bar.focus>i{background:linear-gradient(90deg,#7f92e0,#a6b4f2);}
.mini-caption{font-size:8.5px;color:var(--ink-faint);text-shadow:0 1px 2px rgba(0,0,0,0.9);margin-top:1px;}
.sprite-label .uc-effects{justify-content:center;}
.battle-sprite .floater{position:absolute;left:50%;right:auto;top:auto;transform:translateX(-50%);}
.projectile{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 8px 3px var(--accent-bright);transform:translate(-50%,-50%);animation:projectileFly .32s linear forwards;z-index:5;}
@keyframes projectileFly{from{left:var(--fx);top:var(--fy);}to{left:var(--tx);top:var(--ty);}}
@media (prefers-reduced-motion:reduce){.projectile{display:none;}}
@media(max-width:640px){.battle-stage{aspect-ratio:16/11;}.sprite-name{font-size:9px;}.mini-bar{width:44px;}}

.log-panel{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;max-height:210px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column-reverse;}
.log-line{padding:3px 0;border-bottom:1px solid rgba(236,224,196,0.05);color:var(--ink-dim);}
.log-line b{color:var(--ink);}
.log-line.hit{color:var(--bad);}
.log-line.heal{color:var(--good);}
.log-line.info{color:var(--accent-bright);font-style:italic;}

/* ---- panels: shop / event / camp / reward ---- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.item-card{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.item-card.rare{border-color:#5d7bb0;}
.item-card.epic{border-color:#a56bd6;}
.item-card.common{border-color:var(--border-strong);}
.ic-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
.ic-name{font-weight:700;font-size:13.5px;}
.ic-rarity{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.ic-rarity.common{color:var(--ink-faint);}
.ic-rarity.rare{color:#8fb0e6;}
.ic-rarity.epic{color:#cf9df0;}
.ic-stats{font-family:var(--font-mono);font-size:11.5px;color:var(--good);}
.ic-syn{font-size:11px;color:var(--accent-bright);font-style:italic;}
.event-text{font-size:16px;line-height:1.65;color:var(--ink);margin-bottom:16px;font-style:italic;}
.event-title{margin-bottom:10px;}
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-btn{text-align:left;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:11px 14px;}
.opt-btn:hover:not(:disabled){border-color:var(--accent);}
.opt-btn small{display:block;color:var(--ink-dim);font-weight:400;margin-top:2px;}
.outcome-box{background:var(--bg-elevated);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;margin-top:14px;font-size:13.5px;}
.formation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;}
.form-slot{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:10px;text-align:center;cursor:pointer;}
.form-slot.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.form-slot small{display:block;color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.bench-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.talent-choice{display:flex;gap:12px;flex-wrap:wrap;}
.talent-card{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:14px;text-align:center;}
.talent-card h4{font-size:14px;margin-bottom:6px;}
.talent-card p{font-size:12px;color:var(--ink-dim);margin:0 0 10px;}
.synergy-box{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.synergy-line{font-size:12.5px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--accent-bright);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.slot-picker{display:flex;gap:6px;margin-top:6px;}
.end-screen{text-align:center;padding:60px 20px;}
.end-screen .big{font-size:44px;margin-bottom:10px;}
.stat-row{display:flex;gap:24px;justify-content:center;margin:22px 0;flex-wrap:wrap;}
.stat-row div{font-family:var(--font-mono);}
.stat-row b{display:block;font-size:24px;color:var(--accent-bright);}
.stat-row span{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.05em;}
.muted{color:var(--ink-dim);font-size:12.5px;}
.hidden{display:none !important;}
</style>

function avatarSvg(iconKey, extraClass){
  var d = ICON_PATHS[iconKey];
  if(!d) return '<span class="avatar-fallback">?</span>';
  return '<svg class="icon-svg'+(extraClass?(' '+extraClass):'')+'" viewBox="0 0 512 512" aria-hidden="true"><path d="'+d+'"/></svg>';
}
function avatarHtml(iconKey, colorVar, sizeClass){
  return '<span class="avatar '+(sizeClass||'')+'" style="--avatar-color:'+colorVar+'">'+avatarSvg(iconKey)+'</span>';
}

function generateFillerItem(slot,rarity){
  var names = FILLER_NAMES[slot];
  var name = names[Math.floor(Math.random()*names.length)];
  var mult = RARITY_MULT[rarity];
  var base = {};
  if(slot==='weapon'){
    if(Math.random()<0.5) base.atk = Math.round(3*mult); else base.mag = Math.round(3*mult);
  } else if(slot==='armor'){
    if(Math.random()<0.5){base.ac = Math.round(2*mult);} else {base.hp = Math.round(5*mult);}
    if(rarity!=='common') base.hp = Math.round(4*mult);
  } else {
    var r = Math.random();
    if(r<0.34) base.spd = Math.round(2*mult);
    else if(r<0.67) base.focus = rarity==='common'?0:1;
    else base.critBonus = 0.03*mult;
  }
  return {id:'fill_'+(itemUidCounter++),name:name,slot:slot,rarity:rarity,icon:ITEM_ICONS[slot],base:base,value:RARITY_VALUE[rarity]};
}
function rollRarity(weightBonus){
  var r = Math.random() - (weightBonus||0);
  if(r<0.12) return 'epic';
  if(r<0.45) return 'rare';
  return 'common';
}
function rollLootItem(guaranteedMin){
  var rarity = rollRarity(guaranteedMin==='epic'?0.9:guaranteedMin==='rare'?0.55:0);
  if(guaranteedMin==='epic') rarity='epic';
  if(guaranteedMin==='rare' && rarity==='common') rarity='rare';
  if(Math.random()<0.22){
    var pool = SPECIAL_ITEMS.filter(function(it){return it.rarity===rarity;});
    if(pool.length) return Object.assign({},pool[Math.floor(Math.random()*pool.length)]);
  }
  var slots=['weapon','armor','trinket'];
  var slot = slots[Math.floor(Math.random()*slots.length)];
  return generateFillerItem(slot,rarity);
}

/* ============================= UNIT / STATS HELPERS ============================= */
function makeUnit(classId, level){
  return {classId:classId, level:level||1, xp:0, hp:null, focus:0, equip:{weapon:null,armor:null,trinket:null}, talents:[], slot:null};
}
function activeUnits(state){
  return Object.values(state.roster).filter(function(u){return u.slot!=null;}).sort(function(a,b){return a.slot-b.slot;});
}
function benchUnits(state){ return Object.values(state.roster).filter(function(u){return u.slot==null;}); }
function avgActiveLevel(state){ var au=activeUnits(state); if(!au.length) return 1; return au.reduce(function(s,u){return s+u.level;},0)/au.length; }
function hasFeat(u,featId){ return u && u.classId && CLASSES[u.classId].feat.id===featId; }
function xpToNext(level){ return 20 + (level-1)*15; }

function computeRoleSynergy(party){
  var counts={};
  party.forEach(function(u){ var r=CLASSES[u.classId].role; counts[r]=(counts[r]||0)+1; });
  var syn = {atkPct:0,magPct:0,acFlat:0,healPct:0,firstStrike:false,allPct:0,lines:[]};
  if((counts.tank||0)>=2){ syn.acFlat+=8; syn.lines.push('Rempart uni : +8 CA au groupe (2+ Remparts).'); }
  if(((counts.healer||0)+(counts.support||0))>=2){ syn.healPct+=0.15; syn.lines.push('Sanctuaire : soins +15% (2+ Soigneurs/Soutiens).'); }
  if((counts.caster||0)>=3){ syn.magPct+=0.15; syn.acFlat-=5; syn.lines.push('Confluence Arcanique : dégâts magiques +15%, -5 CA (3+ Lanceurs de sorts).'); }
  if((counts.melee||0)>=2){ syn.atkPct+=0.10; syn.lines.push('Bande de Guerre : dégâts physiques +10% (2+ Guerriers).'); }
  if((counts.ranged||0)>=2){ syn.firstStrike=true; syn.lines.push('Volée : le groupe agit en premier au round 1 (2+ Tireurs).'); }
  var distinctRoles = Object.keys(counts).length;
  if(party.length===4 && distinctRoles===4){ syn.allPct+=0.05; syn.lines.push('Avant-Garde Équilibrée : tous les rôles distincts, +5% à toutes les statistiques.'); }
  return syn;
}
function itemMeetsCond(cond, owner, party){
  if(!cond) return true;
  var role = CLASSES[owner.classId].role;
  if(cond==='roleTank') return role==='tank';
  if(cond==='isHealerClass') return owner.classId==='cleric' || owner.classId==='paladin';
  if(cond==='isSupportClass') return role==='support' || role==='healer';
  if(cond==='twoOtherCasters') return party.filter(function(p){return p.classId!==owner.classId && CLASSES[p.classId].role==='caster';}).length>=2;
  return false;
}
function runBuffTotal(state, statName){
  var t=0; (state.runBuffs||[]).forEach(function(b){ if(b.stat===statName) t+=b.amount; });
  return t;
}
function getStats(unit, state){
  var cls = CLASSES[unit.classId];
  var lvl = unit.level;
  var hp = cls.base.hp + cls.growth.hp*(lvl-1);
  var atk = cls.base.atk + cls.growth.atk*(lvl-1);
  var mag = cls.base.mag + cls.growth.mag*(lvl-1);
  var ac = cls.base.ac + 0.3*(lvl-1);
  var spd = cls.base.spd + 0.2*(lvl-1);
  var focus = cls.base.focus + Math.floor((lvl-1)/3);
  var crit = cls.critBase;
  var party = activeUnits(state);

  unit.talents.forEach(function(t){
    if(t.stat==='hp') hp+=t.amount; else if(t.stat==='atk') atk+=t.amount; else if(t.stat==='mag') mag+=t.amount;
    else if(t.stat==='ac') ac+=t.amount; else if(t.stat==='spd') spd+=t.amount; else if(t.stat==='focus') focus+=t.amount; else if(t.stat==='crit') crit+=t.amount;
  });

  var auraAc=0, auraSpd=0, auraMag=0, auraAtk=0;
  ['weapon','armor','trinket'].forEach(function(slotName){
    var it = unit.equip[slotName]; if(!it) return;
    if(it.base){
      if(it.base.hp) hp+=it.base.hp; if(it.base.atk) atk+=it.base.atk; if(it.base.mag) mag+=it.base.mag;
      if(it.base.ac) ac+=it.base.ac; if(it.base.spd) spd+=it.base.spd; if(it.base.focus) focus+=it.base.focus; if(it.base.critBonus) crit+=it.base.critBonus;
    }
    if(it.critBonus) crit+=it.critBonus;
    if(it.cond && itemMeetsCond(it.cond, unit, party) && it.condBonus){
      if(it.condBonus.ac) ac+=it.condBonus.ac; if(it.condBonus.atk) atk+=it.condBonus.atk; if(it.condBonus.mag) mag+=it.condBonus.mag; if(it.condBonus.hp) hp+=it.condBonus.hp;
    }
    if(it.lowHpAtkBonus && unit.hp!=null){
      var ratio = unit.hp / Math.max(1,hp);
      if(ratio < 0.5){ atk*= (1+it.lowHpAtkBonus); mag*=(1+it.lowHpAtkBonus); }
    }
  });
  party.forEach(function(p){
    ['weapon','armor','trinket'].forEach(function(slotName){
      var it = p.equip[slotName]; if(!it || !it.aura) return;
      if(itemMeetsCond(it.cond, p, party)){
        if(it.aura.ac) auraAc+=it.aura.ac; if(it.aura.spd) auraSpd+=it.aura.spd; if(it.aura.mag) auraMag+=it.aura.mag; if(it.aura.atk) auraAtk+=it.aura.atk;
      }
    });
    if(p.classId!==unit.classId || party.length===1){
      if(hasFeat(p,'auraProtection') && (p.hp==null || p.hp>0)) auraAc+=2;
      if(hasFeat(p,'flashOfGenius') && (p.hp==null || p.hp>0)) auraAc+=2;
      if(hasFeat(p,'jackOfAllTrades') && (p.hp==null || p.hp>0)) crit+=0.03;
    }
  });
  if(hasFeat(unit,'auraProtection')) auraAc+=2;
  if(hasFeat(unit,'flashOfGenius')) auraAc+=2;
  if(hasFeat(unit,'jackOfAllTrades')) crit+=0.03;
  if(hasFeat(unit,'fiendishResilience')) hp*=1.10;
  ac += auraAc; spd += auraSpd; mag += auraMag; atk += auraAtk;

  var syn = computeRoleSynergy(party);
  atk *= (1+syn.atkPct+syn.allPct); mag *= (1+syn.magPct+syn.allPct); ac += syn.acFlat; ac*=(1+syn.allPct); spd*=(1+syn.allPct); hp*=(1+syn.allPct);

  hp += runBuffTotal(state,'hp');
  ac += runBuffTotal(state,'ac');
  var hpPctBuff = runBuffTotal(state,'hpPct');
  hp *= (1+hpPctBuff);

  return {hp:Math.max(1,Math.round(hp)), ac:Math.round(ac*10)/10, atk:Math.round(atk*10)/10, mag:Math.round(mag*10)/10, spd:Math.round(spd*10)/10, focus:focus, crit:Math.min(0.6,crit), healPct:syn.healPct};
}

/* ============================= MAP GENERATION ============================= */
var NODE_ICONS = {combat:'⚔️',elite:'🪦',merchant:'🛒',event:'❔',camp:'🏕️',boss:'🐉'};
function genMap(){
  var layerCount = 7;
  var layers = [];
  for(var i=0;i<layerCount;i++){
    var n = (i===0)?2:(i===layerCount-1?1:(2+Math.floor(Math.random()*2)));
    var nodes=[];
    for(var j=0;j<n;j++){ nodes.push({id:'n'+i+'_'+j, layer:i, idx:j, type:null, visited:false, connections:[]}); }
    layers.push(nodes);
  }
  for(i=0;i<layerCount-1;i++){
    var cur=layers[i], next=layers[i+1];
    cur.forEach(function(node){
      var target = Math.min(next.length-1, Math.round(node.idx/(Math.max(1,cur.length-1))*(next.length-1)));
      node.connections.push(next[target].id);
      if(Math.random()<0.5 && next.length>1){
        var alt = Math.max(0, Math.min(next.length-1, target + (Math.random()<0.5?-1:1)));
        if(next[alt] && node.connections.indexOf(next[alt].id)===-1) node.connections.push(next[alt].id);
      }
    });
    next.forEach(function(nd){
      var hasIncoming = cur.some(function(c){return c.connections.indexOf(nd.id)!==-1;});
      if(!hasIncoming){ var from = cur[Math.floor(Math.random()*cur.length)]; from.connections.push(nd.id); }
    });
  }
  layers[0].forEach(function(n){n.type='combat';});
  layers[layerCount-1][0].type='boss';
  var midTypes=[];
  for(i=1;i<layerCount-1;i++){
    layers[i].forEach(function(n){
      if(i===layerCount-2 && midTypes.indexOf('camp')===-1 && Math.random()<0.7){ n.type='camp'; midTypes.push('camp'); return; }
      var r=Math.random();
      var t = r<0.48?'combat': r<0.60?'elite': r<0.75?'merchant': r<0.93?'event':'camp';
      n.type=t; midTypes.push(t);
    });
  }
  ['merchant','event','camp'].forEach(function(need){
    if(midTypes.indexOf(need)===-1){
      var candidates=[];
      for(i=1;i<layerCount-2;i++) layers[i].forEach(function(n){ if(n.type==='combat') candidates.push(n); });
      if(candidates.length){ candidates[Math.floor(Math.random()*candidates.length)].type=need; }
    }
  });
  var all=[]; layers.forEach(function(l){ l.forEach(function(n){ all.push(n); }); });
  var byId={}; all.forEach(function(n){byId[n.id]=n;});
  return {layers:layers.length, nodes:all, byId:byId};
}
function availableNodeIds(){
  if(!state.currentNodeId){ return state.mapNodes.nodes.filter(function(n){return n.layer===0;}).map(function(n){return n.id;}); }
  var cur = state.mapNodes.byId[state.currentNodeId];
  return cur.connections;
}

/* ============================= COMBAT ENGINE ============================= */
function spawnEnemyInstance(def, row, idx, floorFactor){
  var f = floorFactor;
  return {
    uid:'e'+idx, name:def.name, icon:def.icon, isEnemy:true, row:row, melee:def.melee,
    hp:Math.round(def.hp*f), maxHp:Math.round(def.hp*f), ac:Math.round(def.ac + f*1.2),
    atk:Math.round(def.atk*f), mag:Math.round(def.mag*f), spd:def.spd, focus:0, focusMax:0, crit:0.06,
    gold:Math.round(def.gold*f), xp:Math.round(def.xp*f),
    abilities:[{id:'basic',name:'Attaque',kind:'attack',stat:def.mag>def.atk?'MAG':'ATK',power:1.0,melee:def.melee,cooldown:0}]
      .concat((def.specials||[]).map(function(s){ return Object.assign({},s,{_cd:0}); })),
    tempEffects:[], usedFeatFlags:{}, elite:!!def.elite, boss:!!def.boss, _enraged:false
  };
}
function buildEnemyGroup(node){
  var floorIdx = node.layer;
  var factor = 1 + floorIdx*0.11 + (state.ngPlus||0)*0.2;
  var group = [];
  if(node.type==='boss'){ group.push(spawnEnemyInstance(BOSS_DEF,'back',0,factor*1.05)); return group; }
  if(node.type==='elite'){
    group.push(spawnEnemyInstance(ELITE_DEF,'front',0,factor*1.08));
    var keys=Object.keys(ENEMY_DEFS);
    group.push(spawnEnemyInstance(ENEMY_DEFS[keys[Math.floor(Math.random()*keys.length)]],'back',1,factor*0.8));
    return group;
  }
  if(state.forcedEncounter==='champion'){
    state.forcedEncounter=null;
    group.push(spawnEnemyInstance({name:'Champion Errant',icon:'champion',melee:true,hp:34,atk:10,mag:0,ac:13,spd:12,gold:26,xp:24,specials:[{id:'ch1',name:'Estoc précis',kind:'attack',stat:'ATK',power:1.5,melee:true,cooldown:2}]},'front',0,factor));
    return group;
  }
  var count = 1 + Math.floor(Math.random()*2) + (floorIdx>3?1:0);
  count = Math.min(count,3);
  var keys2 = Object.keys(ENEMY_DEFS);
  for(var i=0;i<count;i++){
    var def = ENEMY_DEFS[keys2[Math.floor(Math.random()*keys2.length)]];
    group.push(spawnEnemyInstance(def, i<2?'front':'back', i, factor));
  }
  return group;
}
function startCombat(node){
  var enemies = buildEnemyGroup(node);
  var party = activeUnits(state).map(function(u){
    var st = getStats(u,state);
    if(u.hp==null) u.hp = st.hp;
    u.hp = Math.min(u.hp, st.hp);
    return {uid:u.classId, isEnemy:false, name:CLASSES[u.classId].name, icon:CLASSES[u.classId].icon, classId:u.classId,
      row: u.slot<2?'front':'back', hp:u.hp, maxHp:st.hp, ac:st.ac, atk:st.atk, mag:st.mag, spd:st.spd,
      focus:Math.min(st.focus,1), focusMax:st.focus, crit:st.crit, healPct:st.healPct, level:u.level,
      tempEffects:[], usedFeatFlags:{}};
  });
  state.combat = {enemies:enemies, party:party, queue:[], qIndex:0, round:0, log:[], ended:false, result:null, node:node, autoPlay:true, speed:750, _timer:null, fx:{floaters:[],attackerUid:null,deaths:[]}};
  logMsg("Le combat commence : "+enemies.map(function(e){return e.name;}).join(', ')+" !",'info');
  var beastUnits = party.filter(function(p){ return hasFeat(state.roster[p.classId],'beastCompanion'); });
  beastUnits.forEach(function(p){
    var alive = enemies.filter(function(e){return e.hp>0;});
    if(alive.length){ var target = alive.reduce(function(a,b){return b.hp<a.hp?b:a;}); var dmg=Math.max(1,Math.round(p.atk*0.5)); target.hp=Math.max(0,target.hp-dmg); logMsg(p.name+" (compagnon animal) mord "+target.name+" pour "+dmg+" dégâts.",'hit'); }
  });
  newRound();
  tickCombat();
}
function logMsg(text, cls){ state.combat.log.push({text:text, cls:cls||''}); if(state.combat.log.length>80) state.combat.log.shift(); }
function fxFloat(uid, text, cls){ if(state.combat && state.combat.fx) state.combat.fx.floaters.push({uid:uid, text:text, cls:cls}); }
function fxDeath(uid){ if(state.combat && state.combat.fx) state.combat.fx.deaths.push(uid); }
function newRound(){
  var c = state.combat; c.round++;
  var all = c.party.concat(c.enemies).filter(function(u){return u.hp>0;});
  var firstStrike = computeRoleSynergy(activeUnits(state)).firstStrike && c.round===1;
  all.forEach(function(u){ u._roll = (firstStrike && !u.isEnemy) ? 999 : u.spd + Math.random()*3; });
  all.sort(function(a,b){return b._roll-a._roll;});
  c.queue = all.map(function(u){return {uid:u.uid, isEnemy:u.isEnemy};});
  c.qIndex = 0;
}
function findCombatant(uid, isEnemy){
  var c=state.combat; var list = isEnemy?c.enemies:c.party;
  return list.find(function(u){return u.uid===uid;});
}
function currentActor(){
  var c=state.combat; if(c.qIndex>=c.queue.length) return null;
  var ref = c.queue[c.qIndex]; return findCombatant(ref.uid, ref.isEnemy);
}
function decayEffects(u){
  u.tempEffects = u.tempEffects.filter(function(e){ e.turns-=1; return e.turns>0; });
}
function effectiveCombatStats(u){
  var ac=u.ac, atk=u.atk, mag=u.mag, spd=u.spd, dodge=0, stunned=false, weaken=0, markUp=0;
  u.tempEffects.forEach(function(e){
    if(e.type==='buffAc'||e.type==='debuffAcTarget') ac+=e.amount;
    if(e.type==='debuffAc') ac-=e.amount;
    if(e.type==='buffAtk') atk += e.pct? u.atk*e.amount : e.amount;
    if(e.type==='debuffAtk') atk-=e.amount;
    if(e.type==='buffSpd') spd+=e.amount;
    if(e.type==='debuffSpd') spd-=e.amount;
    if(e.type==='dodge') dodge=Math.max(dodge,e.amount);
    if(e.type==='stunActive') stunned=true;
    if(e.type==='weaken') weaken=Math.max(weaken,e.amount);
    if(e.type==='markDamage') markUp=Math.max(markUp,e.amount);
    if(e.type==='buffAtkSelf') atk+=e.amount;
    if(e.type==='buffMagSelf') mag+=e.amount;
    if(e.type==='debuffAcSelf') ac-=e.amount;
    if(e.type==='buffAtkFromMag') atk += u.mag;
    if(e.type==='shield') {}
  });
  return {ac:Math.max(0,ac), atk:Math.max(0,atk), mag:Math.max(0,mag), spd:spd, dodge:dodge, stunned:stunned, weaken:weaken, markUp:markUp};
}
function shieldAmount(u){ var s=0; u.tempEffects.forEach(function(e){ if(e.type==='shield') s+=e.remaining; }); return s; }
function consumeShield(u, dmg){
  for(var i=0;i<u.tempEffects.length;i++){
    var e=u.tempEffects[i];
    if(e.type==='shield' && e.remaining>0){
      var absorbed = Math.min(e.remaining, dmg);
      e.remaining -= absorbed; dmg -= absorbed;
      if(dmg<=0) return 0;
    }
  }
  return dmg;
}
function classFeatOwner(uid){ return state.roster ? state.roster[uid] : null; }

function dealDamage(attacker, target, ability, isAoe){
  if(!target || target.hp<=0) return;
  var aStats = effectiveCombatStats(attacker);
  var base = (ability.stat==='MAG'? (attacker.mag+ (attacker.tempEffects||[]).reduce(function(s,e){return s+(e.type==='buffMagSelf'?e.amount:0);},0)) : aStats.atk);
  var power = ability.power * (isAoe?0.85:1);
  var dmg = base*power;
  if(ability.bonusMag) dmg += attacker.mag*ability.bonusMag;
  if(ability.bonusDmg) dmg += (ability.stat==='MAG'?attacker.mag:aStats.atk)*ability.bonusDmg;
  dmg *= (0.88+Math.random()*0.24);
  var attackerWeaken = aStats.weaken;
  if(attackerWeaken) dmg *= (1-attackerWeaken);
  var tStats = effectiveCombatStats(target);
  dmg -= tStats.ac*0.4;
  if(tStats.markUp) dmg *= (1+tStats.markUp);
  dmg = Math.max(1, Math.round(dmg));
  var crit=false;
  if(Math.random() < attacker.crit){ dmg = Math.round(dmg*1.5); crit=true; }
  if(Math.random() < tStats.dodge){ logMsg(target.name+" esquive l'attaque de "+attacker.name+" !", 'info'); fxFloat(target.uid,'Esquive !','dodge'); return; }
  var featOwner = classFeatOwner(target.uid);
  if(featOwner && hasFeat(featOwner,'uncannyDodge') && Math.random()<0.25){ dmg=Math.max(1,Math.round(dmg/2)); logMsg(target.name+" atténue le coup (Esquive surnaturelle).",'info'); }
  if(featOwner && hasFeat(featOwner,'ragingWall') && !target.usedFeatFlags.ragingWall && target.hp>0 && (target.hp-dmg)/target.maxHp<0.25){
    dmg=Math.round(dmg/2); target.usedFeatFlags.ragingWall=true; logMsg(target.name+" encaisse grâce à sa volonté increvable.",'info');
  }
  dmg = consumeShield(target, dmg);
  target.hp = Math.max(0, target.hp-dmg);
  logMsg(attacker.name+" utilise "+ability.name+" sur "+target.name+" : "+dmg+" dégâts"+(crit?' (Critique !)':'')+".", 'hit');
  fxFloat(target.uid, '-'+dmg, crit?'dmg crit':'dmg');
  if(ability.effect) applyEffect(attacker, target, ability.effect, isAoe);
  if(ability.effect2) applyEffect(attacker, target, ability.effect2, isAoe);
  if(ability.lifesteal){ var healed=Math.round(dmg*ability.lifesteal); attacker.hp = Math.min(attacker.maxHp, attacker.hp + healed); logMsg(attacker.name+" draine "+healed+" PV.",'heal'); fxFloat(attacker.uid,'+'+healed,'heal'); }
  if(target.hp<=0){
    if(featOwner && hasFeat(featOwner,'divineIntervention') && !state.combat._divineUsed){
      target.hp=1; state.combat._divineUsed=true; logMsg("Intervention divine ! "+target.name+" survit avec 1 PV.",'heal');
    } else {
      logMsg(target.name+" s'effondre !", 'info');
      fxDeath(target.uid);
    }
  }
}
function applyEffect(attacker, target, eff, isAoe){
  if(eff.type==='stun'){
    if(Math.random()<(eff.chance||1)) target.tempEffects.push({type:'stunActive', turns:(eff.turns||1)+1});
    return;
  }
  if(eff.type==='debuffAcSelf'){ attacker.tempEffects.push({type:'debuffAcSelf', amount:eff.amount, turns:eff.turns+1}); return; }
  if(eff.type==='buffAtkFromMag'){ attacker.tempEffects.push({type:'buffAtkFromMag', amount:0, turns:eff.turns+1}); return; }
  if(eff.type==='buffAtkSelf'){ attacker.tempEffects.push({type:'buffAtkSelf', amount:eff.amount, turns:eff.turns+1}); return; }
  if(eff.type==='buffMagSelf'){ attacker.tempEffects.push({type:'buffMagSelf', amount:eff.amount, turns:eff.turns+1}); return; }
  if(eff.type==='markDamage'){ target.tempEffects.push({type:'markDamage', amount:eff.amount, turns:eff.turns+1}); return; }
  if(eff.type==='weaken'){ target.tempEffects.push({type:'weaken', amount:eff.amount, turns:eff.turns+1}); return; }
  target.tempEffects.push(Object.assign({},eff,{turns:eff.turns+1}));
}
function applyHeal(caster, target, ability, isAll){
  if(!target || target.hp<=0) return;
  var featOwner = classFeatOwner(caster.uid);
  var mult = isAll ? (ability.healAllPower||1) : 1;
  var healPct = caster.healPct||0;
  if(featOwner && featOwner.equip){
    ['weapon','armor','trinket'].forEach(function(s){ var it=featOwner.equip[s]; if(it && it.healMult && itemMeetsCond(it.cond, featOwner, activeUnits(state))) healPct += it.healMult; });
  }
  var amt = Math.round(caster.mag*(ability.power||1)*mult*(1+healPct));
  target.hp = Math.min(target.maxHp, target.hp+amt);
  logMsg(caster.name+" soigne "+target.name+" de "+amt+" PV.", 'heal');
  fxFloat(target.uid, '+'+amt, 'heal');
  if(ability.cleanse){ target.tempEffects = target.tempEffects.filter(function(e){return !['debuffAc','debuffAtk','debuffSpd','stunActive','weaken','markDamage'].includes(e.type);}); logMsg(target.name+" est purifié de ses afflictions.",'heal'); }
  if(ability.effect && ability.effect.onTarget){ target.tempEffects.push(Object.assign({},ability.effect,{turns:ability.effect.turns+1})); }
}
function applyBuff(caster, target, ability, isAll){
  if(!target || target.hp<=0) return;
  if(ability.effect) applyEffect(caster, target, ability.effect, false);
  if(ability.effect2) applyEffect(caster, target, ability.effect2, false);
  if(ability.healAllPower){ applyHeal(caster, target, {power:ability.healAllPower, stat:'MAG'}, true); }
  logMsg(target.name+" est renforcé par "+caster.name+" ("+ability.name+").", 'heal');
  fxFloat(target.uid, ability.name, 'buff');
}
function applyShield(caster, ability){
  var amt = Math.round(caster.mag*(ability.power||1));
  caster.tempEffects.push({type:'shield', remaining:amt, turns:3});
  logMsg(caster.name+" invoque un bouclier de "+amt+" PV.", 'heal');
  fxFloat(caster.uid, 'Bouclier +'+amt, 'buff');
}
function performAbility(actor, ability, targetUid){
  var isEnemyActor = !!actor.isEnemy;
  var allies = isEnemyActor ? state.combat.enemies : state.combat.party;
  var foes = isEnemyActor ? state.combat.party : state.combat.enemies;
  if(state.combat.fx){
    var isPhysicalHit = !!ability.melee && ['attack','aoeAttack','debuff'].indexOf(ability.kind)!==-1;
    state.combat.fx.attackAnim = isPhysicalHit ? 'lunge' : 'cast';
    if(ability.kind==='attack' && !ability.melee && targetUid){
      state.combat.fx.projectile = {fromUid:actor.uid, fromIsEnemy:isEnemyActor, toUid:targetUid, toIsEnemy:!isEnemyActor};
    }
  }
  if(ability.kind==='attack') dealDamage(actor, foes.find(function(f){return f.uid===targetUid;}), ability, false);
  else if(ability.kind==='aoeAttack') foes.filter(function(f){return f.hp>0;}).forEach(function(f){dealDamage(actor,f,ability,true);});
  else if(ability.kind==='heal') applyHeal(actor, allies.find(function(a){return a.uid===targetUid;}), ability, false);
  else if(ability.kind==='healAll') allies.filter(function(a){return a.hp>0;}).forEach(function(a){applyHeal(actor,a,ability,true);});
  else if(ability.kind==='buffSelf') applyBuff(actor, actor, ability, false);
  else if(ability.kind==='buffAll') allies.filter(function(a){return a.hp>0;}).forEach(function(a){applyBuff(actor,a,ability,true);});
  else if(ability.kind==='debuff') applyDebuffKind(actor, foes, ability, targetUid);
  else if(ability.kind==='shieldSelf') applyShield(actor, ability);
  if(ability.selfHealPct){ var shAmt=Math.round(actor.maxHp*ability.selfHealPct); actor.hp=Math.min(actor.maxHp, actor.hp+shAmt); logMsg(actor.name+" récupère "+shAmt+" PV.",'heal'); fxFloat(actor.uid,'+'+shAmt,'heal'); }
  if(ability.twice && ability.kind==='attack'){ dealDamage(actor, foes.find(function(f){return f.uid===targetUid;}), ability, false); }
}
function applyDebuffKind(actor, foes, ability, targetUid){
  var targets = ability.target==='all' ? foes.filter(function(f){return f.hp>0;}) : [foes.find(function(f){return f.uid===targetUid;})];
  targets.forEach(function(t){
    if(!t || t.hp<=0) return;
    if(ability.power){ dealDamage(actor, t, ability, ability.target==='all'); }
    else { if(ability.effect) applyEffect(actor,t,ability.effect,false); if(ability.effect2) applyEffect(actor,t,ability.effect2,false); logMsg(actor.name+" affecte "+t.name+" avec "+ability.name+".", 'info'); fxFloat(t.uid, ability.name, 'status'); }
  });
}
function targetableList(ability, side){
  if(ability.target==='self') return [];
  if(['heal','buffAlly'].includes(ability.kind)) return side.filter(function(u){return u.hp>0;});
  if(['attack','debuff'].includes(ability.kind) && ability.target!=='all'){
    if(ability.melee){
      var front = side.filter(function(u){return u.hp>0 && u.row==='front';});
      return front.length ? front : side.filter(function(u){return u.hp>0;});
    }
    return side.filter(function(u){return u.hp>0;});
  }
  return [];
}
function checkCombatEnd(){
  var c = state.combat;
  if(c.enemies.every(function(e){return e.hp<=0;})){ c.ended=true; c.result='victory'; return true; }
  if(c.party.every(function(p){return p.hp<=0;})){ c.ended=true; c.result='defeat'; return true; }
  return false;
}
function enemyChooseAndAct(enemy){
  enemy.abilities.forEach(function(a){ if(a._cd>0) a._cd--; });
  var specials = enemy.abilities.filter(function(a){return a.id!=='basic' && a._cd<=0;});
  var chosen = (specials.length && Math.random()<0.65) ? specials[Math.floor(Math.random()*specials.length)] : enemy.abilities[0];
  var targetUid=null;
  if(['attack','debuff'].includes(chosen.kind) && chosen.target!=='all'){
    var pool = targetableList(chosen, state.combat.party);
    if(!pool.length) pool = state.combat.party.filter(function(p){return p.hp>0;});
    if(!pool.length) return;
    var t = chosen.target==='lowestHpAlly' ? pool.reduce(function(a,b){return b.hp/b.maxHp<a.hp/a.maxHp?b:a;}) : pool[Math.floor(Math.random()*pool.length)];
    targetUid = t.uid;
  } else if(chosen.kind==='heal' && chosen.target==='self'){ targetUid=enemy.uid; }
  performAbility(enemy, chosen, targetUid);
  if(chosen.id!=='basic') chosen._cd = chosen.cooldown;
  if(enemy.boss && !enemy._enraged && enemy.hp>0 && enemy.hp<=enemy.maxHp*0.5){
    enemy._enraged=true; enemy.atk=Math.round(enemy.atk*1.2); enemy.mag=Math.round(enemy.mag*1.2);
    logMsg("⚠ "+enemy.name+" entre en fureur ! Ses attaques deviennent bien plus dangereuses.", 'info');
  }
}
function startOfTurnUpkeep(u){
  if(u.hp<=0) return false;
  if(!u.isEnemy){
    var owner = classFeatOwner(u.uid);
    var regen = 1 + (owner && hasFeat(owner,'arcaneRecovery') ? 1 : 0);
    u.focus = Math.min(u.focusMax, u.focus+regen);
    if(owner && hasFeat(owner,'naturalRecovery')) u.hp=Math.min(u.maxHp, u.hp+Math.max(1,Math.round(u.maxHp*0.05)));
    if(owner && hasFeat(owner,'secondWind') && !u.usedFeatFlags.secondWind && u.hp/u.maxHp<0.3){
      u.hp=Math.min(u.maxHp, u.hp+Math.round(u.maxHp*0.2)); u.usedFeatFlags.secondWind=true; logMsg(u.name+" reprend son souffle et se soigne.",'heal');
    }
  }
  var stunEff = u.tempEffects.find(function(e){return e.type==='stunActive';});
  if(stunEff){
    logMsg(u.name+" est étourdi et ne peut agir !", 'info');
    u.tempEffects = u.tempEffects.filter(function(e){return e!==stunEff;});
    return false;
  }
  return true;
}
function advanceQueueIndex(){
  var c=state.combat; c.qIndex++;
  if(c.qIndex>=c.queue.length){
    c.party.concat(c.enemies).forEach(decayEffects);
    newRound();
  }
}
function payFocus(actor, ability){
  var owner = classFeatOwner(actor.uid);
  var free = owner && hasFeat(owner,'metamagic') && Math.random()<0.15;
  actor.focus -= free?0:ability.cost;
  if(free) logMsg(actor.name+" lance le sort gratuitement (Métamagie) !", 'info');
}
function playerAutoAct(actor){
  var cls = CLASSES[actor.classId];
  var alliesAlive = state.combat.party.filter(function(p){return p.hp>0;});
  var enemiesAlive = state.combat.enemies.filter(function(e){return e.hp>0;});
  if(!alliesAlive.length || !enemiesAlive.length) return;
  var mostWounded = alliesAlive.reduce(function(a,b){return (b.hp/b.maxHp < a.hp/a.maxHp) ? b : a;});
  var woundedCount = alliesAlive.filter(function(a){return a.hp/a.maxHp<0.5;}).length;

  var healAbilities = cls.abilities.filter(function(a){return (a.kind==='heal'||a.kind==='healAll') && actor.focus>=a.cost;});
  if(mostWounded.hp/mostWounded.maxHp < 0.3 && !healAbilities.length && state.consumables.healPotion>0){
    var amt = Math.round(mostWounded.maxHp*0.4);
    mostWounded.hp = Math.min(mostWounded.maxHp, mostWounded.hp+amt);
    state.consumables.healPotion--;
    logMsg(actor.name+" utilise une Potion de soin sur "+mostWounded.name+" (+"+amt+" PV).", 'heal');
    return;
  }
  if(healAbilities.length && woundedCount>0){
    var healAb = (woundedCount>=2 && healAbilities.some(function(a){return a.kind==='healAll';}))
      ? healAbilities.find(function(a){return a.kind==='healAll';})
      : healAbilities[0];
    payFocus(actor, healAb);
    performAbility(actor, healAb, healAb.kind==='heal'?mostWounded.uid:null);
    return;
  }
  var buffAbilities = cls.abilities.filter(function(a){return ['buffSelf','buffAll','shieldSelf'].indexOf(a.kind)!==-1 && actor.focus>=a.cost;});
  if(buffAbilities.length && state.combat.round<=1){
    var buffAb = buffAbilities[0];
    payFocus(actor, buffAb);
    performAbility(actor, buffAb, null);
    return;
  }
  var debuffAbilities = cls.abilities.filter(function(a){return a.kind==='debuff' && actor.focus>=a.cost;});
  if(debuffAbilities.length && Math.random()<0.3){
    var deb = debuffAbilities[0];
    var debTargetUid = null;
    if(deb.target!=='all'){
      var debPool = targetableList(deb, enemiesAlive);
      if(!debPool.length) debPool = enemiesAlive;
      debTargetUid = debPool[Math.floor(Math.random()*debPool.length)].uid;
    }
    payFocus(actor, deb);
    performAbility(actor, deb, debTargetUid);
    return;
  }
  var dmgAbilities = cls.abilities.filter(function(a){return (a.kind==='attack'||a.kind==='aoeAttack') && actor.focus>=a.cost;});
  var chosen = null;
  if(enemiesAlive.length>=2) chosen = dmgAbilities.find(function(a){return a.kind==='aoeAttack';});
  if(!chosen){
    var singles = dmgAbilities.filter(function(a){return a.kind==='attack';});
    chosen = singles.length ? singles.reduce(function(a,b){return (b.power||0)>(a.power||0)?b:a;}) : cls.abilities[0];
  }
  var atkTargetUid = null;
  if(chosen.kind==='attack'){
    var atkPool = targetableList(chosen, enemiesAlive);
    if(!atkPool.length) atkPool = enemiesAlive;
    atkTargetUid = atkPool.reduce(function(a,b){return b.hp<a.hp?b:a;}).uid;
  }
  payFocus(actor, chosen);
  performAbility(actor, chosen, atkTargetUid);
}
function combatStep(){
  var c = state.combat;
  if(!c || c.ended) return true;
  var guard=0;
  while(guard++<50){
    if(checkCombatEnd()){ onCombatEnd(); return true; }
    var actor = currentActor();
    if(!actor){ advanceQueueIndex(); continue; }
    if(actor.hp<=0){ advanceQueueIndex(); continue; }
    var canAct = startOfTurnUpkeep(actor);
    if(!canAct){ advanceQueueIndex(); if(checkCombatEnd()){ onCombatEnd(); return true; } continue; }
    c.fx = {floaters:[], attackerUid:actor.uid, attackerIsEnemy:!!actor.isEnemy, deaths:[]};
    if(actor.isEnemy) enemyChooseAndAct(actor); else playerAutoAct(actor);
    if(checkCombatEnd()){ onCombatEnd(); return true; }
    advanceQueueIndex();
    return false;
  }
  return false;
}
function tickCombat(){
  if(!state.combat || state.combat.ended) return;
  var done = combatStep();
  render();
  if(done) return;
  if(state.combat && state.combat.autoPlay){
    state.combat._timer = setTimeout(tickCombat, state.combat.speed);
  }
}
function onResumeCombat(){
  if(!state.combat || state.combat.ended) return;
  clearTimeout(state.combat._timer);
  state.combat.autoPlay = true;
  tickCombat();
}
function onPauseCombat(){
  if(!state.combat) return;
  clearTimeout(state.combat._timer);
  state.combat.autoPlay = false;
  render();
}
function onStepCombat(){
  if(!state.combat || state.combat.ended) return;
  clearTimeout(state.combat._timer);
  state.combat.autoPlay = false;
  combatStep();
  render();
}
function onToggleCombatSpeed(){
  if(!state.combat) return;
  state.combat.speed = state.combat.speed<=300 ? 750 : 250;
  render();
}
function onSkipCombat(){
  if(!state.combat) return;
  clearTimeout(state.combat._timer);
  state.combat.autoPlay = false;
  var guard=0;
  while(state.combat && !state.combat.ended && guard++<600){ combatStep(); }
  render();
}
function onCombatEnd(){
  var c = state.combat;
  if(c._timer) clearTimeout(c._timer);
  state.runBuffs = state.runBuffs.map(function(b){return Object.assign({},b,{combatsLeft:b.combatsLeft-1});}).filter(function(b){return b.combatsLeft>0;});
  if(c.result==='defeat'){
    state.view='END'; state.screen={outcome:'defeat', floor:c.node.layer};
    if(c.node.layer > (state.meta.bestFloor||0)){ state.meta.bestFloor=c.node.layer; saveMeta(state.meta); }
    clearSave(); render(); return;
  }
  c.party.forEach(function(p){ var u=state.roster[p.classId]; u.hp=p.hp; });
  var goldGain = c.enemies.reduce(function(s,e){return s+e.gold;},0);
  state.gold += goldGain;
  var xpGain = c.enemies.reduce(function(s,e){return s+e.xp;},0);
  var levelUps=[];
  activeUnits(state).forEach(function(u){
    u.xp += xpGain;
    while(u.xp>=xpToNext(u.level)){
      u.xp -= xpToNext(u.level); u.level++;
      var opts = TALENT_POOL.slice().sort(function(){return Math.random()-0.5;}).slice(0,2);
      levelUps.push({classId:u.classId, options:opts});
    }
  });
  activeUnits(state).forEach(function(u){ var st=getStats(u,state); if(u.hp>st.hp) u.hp=st.hp; });
  var lootRarityMin = c.node.type==='boss' ? 'epic' : (c.node.type==='elite' ? 'rare' : null);
  var loot = [rollLootItem(lootRarityMin), rollLootItem(lootRarityMin), rollLootItem(lootRarityMin)];
  state.combat = null;
  state.view='REWARD';
  state.screen = {goldGain:goldGain, xpGain:xpGain, levelUps:levelUps, levelUpIndex:0, loot:loot, lootTaken:false, node:c.node, isBoss:c.node.type==='boss'};
  saveGame();
  render();
}

/* ============================= VIEW: RENDER ROOT ============================= */
function render(){
  var app = document.getElementById('app');
  var html = '';
  if(state.view==='TITLE') html = renderTitle();
  else if(state.view==='BUILD') html = renderBuild();
  else {
    html += renderTopbar();
    if(state.view==='MAP') html += renderMap();
    else if(state.view==='COMBAT') html += renderCombat();
    else if(state.view==='REWARD') html += renderReward();
    else if(state.view==='SHOP') html += renderShop();
    else if(state.view==='EVENT') html += renderEvent();
    else if(state.view==='CAMP') html += renderCamp();
    else if(state.view==='END') html += renderEnd();
  }
  html += renderHelpModal();
  app.innerHTML = html;
  var logEl = document.querySelector('.log-panel');
  if(logEl) logEl.scrollTop = 0;
}

function renderTopbar(){
  var au = activeUnits(state);
  var cards = au.map(function(u){
    var st = getStats(u,state);
    var hpCur = u.hp==null?st.hp:u.hp;
    var hpPct = Math.max(0,Math.min(100, Math.round(hpCur/st.hp*100)));
    return '<div class="tb-card">'+avatarHtml(u.classId, roleColor(CLASSES[u.classId].role), 'avatar-sm')+'<div class="tb-body">'+
      '<div class="tb-name">'+CLASSES[u.classId].name+' <span class="mono" style="color:var(--ink-faint)">Nv.'+u.level+'</span>'+(hpCur<=0?' <span class="tb-ko">K.O.</span>':'')+'</div>'+
      '<div class="bar bar-hp'+(hpPct<35?' low':'')+'"><i style="width:'+hpPct+'%"></i></div>'+
      '</div></div>';
  }).join('');
  return '<div class="topbar"><div class="topbar-inner">'+
    '<div class="topbar-brand">🗝️ La Crypte aux Treize Voies</div>'+
    '<div class="topbar-party">'+cards+'</div>'+
    '<div class="topbar-meta"><span title="Or">🪙 '+state.gold+'</span><span title="Potions">🧪 '+(state.consumables.healPotion||0)+'</span><span title="Élixirs">⚗️ '+(state.consumables.elixir||0)+'</span>'+
    '<button class="help-btn" onclick="onToggleHelp()" title="Aide">?</button></div>'+
    '</div></div>';
}
function onToggleHelp(){ state.showHelp = !state.showHelp; render(); }
function renderHelpModal(){
  if(!state.showHelp) return '';
  var sections = [
    {t:'🎯 Le principe', body:"Composez une compagnie de 4 héros parmi 13 classes, puis descendez dans la Crypte. Chaque salle vous fait progresser ; le boss final vous attend au bout du chemin."},
    {t:'⚔ Combat automatique', body:"Une fois le combat lancé, chaque personnage agit seul (soigne les blessés, pose ses buffs, achève les ennemis faibles). Utilisez Pause / Étape suivante / Terminer le combat pour contrôler le rythme. Toute la stratégie se joue avant et après : composition, équipement, formation."},

    {t:'✦ Synergies', body:"Le rôle de chaque classe (Rempart, Guerrier, Tireur, Soigneur, Soutien, Lanceur de sorts) crée des bonus d'équipe automatiques selon votre composition — consultez le panneau Synergies sur la carte."},
    {t:'🎒 Butin & progression', body:"Après chaque combat, choisissez un objet parmi 3 et répartissez l'expérience. Au niveau supérieur, choisissez un talent permanent. Certains objets sont plus puissants selon la classe ou la composition qui les porte."}

  return '<div class="modal-backdrop" onclick="onToggleHelp()"><div class="modal-box" onclick="event.stopPropagation()">'+
    '<div class="modal-head"><h3>Comment jouer</h3><button class="btn btn-ghost btn-sm" onclick="onToggleHelp()">Fermer ✕</button></div>'+
    sections.map(function(s){ return '<div class="help-section"><h4>'+s.t+'</h4><p>'+s.body+'</p></div>'; }).join('')+
    '<div class="help-credits">Icônes par <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (CC BY 3.0) — delapouite, lorc, skoll, cathelineau, darkzaitzev.</div>'+
    '</div></div>';

  }).join('');
  var syn = picks.length? computeRoleSynergy(picks.map(function(cid){return {classId:cid};})) : {lines:[]};
  return '<div class="wrap">'+

    '<div style="display:flex;gap:8px;align-items:center;"><button class="btn btn-ghost btn-sm" onclick="onToggleHelp()">Aide</button><button class="btn btn-primary" '+(picks.length===4?'':'disabled')+' onclick="onConfirmBuild()">Descendre dans le donjon →</button></div></div>'+
    '<div class="roster-strip">'+slots+'</div>'+
    (syn.lines.length? '<div class="synergy-box">'+syn.lines.map(function(l){return '<div class="synergy-line">✦ '+l+'</div>';}).join('')+'</div>':'')+
    '<div class="class-grid" style="margin-top:20px;">'+cards+'</div>'+

}
function roleColor(role){ return 'var(--role-'+role+')'; }
function enemyColor(u){ return u.boss ? 'var(--enemy-boss)' : (u.elite ? 'var(--enemy-elite)' : 'var(--enemy-common)'); }
function onToggleClass(cid){
  var i = state.buildPicks.indexOf(cid);
  if(i!==-1) state.buildPicks.splice(i,1);
  else if(state.buildPicks.length<4) state.buildPicks.push(cid);

}
function onConfirmBuild(){
  if(state.buildPicks.length!==4) return;
  state.buildPicks.forEach(function(cid,i){ var u=makeUnit(cid,1); u.slot=i; state.roster[cid]=u; });
  activeUnits(state).forEach(function(u){ u.hp = getStats(u,state).hp; });
  state.mapNodes = genMap(); state.currentNodeId=null; state.floor=0;
  state.view='MAP'; saveGame(); render();
}

/* ---- MAP ---- */
function mapLayout(){
  var m = state.mapNodes;
  var layerW = 130, padX=50, padY=40;
  var maxNodesInLayer = 0;
  var byLayer = {};
  m.nodes.forEach(function(n){ (byLayer[n.layer]=byLayer[n.layer]||[]).push(n); maxNodesInLayer=Math.max(maxNodesInLayer, byLayer[n.layer].length); });
  var svgH = padY*2 + maxNodesInLayer*100;
  var svgW = padX*2 + (m.layers-1)*layerW + 70;
  function pos(n){
    var arr = byLayer[n.layer];
    var y = padY + (arr.length===1 ? svgH/2-padY : n.idx*( (svgH-padY*2) / Math.max(1,arr.length-1) ));
    var x = padX + n.layer*layerW;
    return {x:x,y:y};
  }
  return {svgW:svgW, svgH:svgH, padX:padX, pos:pos, startPos:{x:padX-58,y:svgH/2}};
}
function renderMap(){
  var avail = availableNodeIds();
  var m = state.mapNodes;
  var L = mapLayout();
  var pos = L.pos;
  var travel = state.mapTravel;
  var lines='';
  m.nodes.forEach(function(n){
    var p1=pos(n);
    n.connections.forEach(function(cid){
      var p2=pos(m.byId[cid]);
      var dim = state.currentNodeId===n.id ? '0.85' : (n.visited?'0.25':'0.15');
      lines += '<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="var(--border-strong)" stroke-width="2" opacity="'+dim+'"/>';
    });
  });
  var nodesHtml = m.nodes.map(function(n){
    var p = pos(n);
    var isAvail = !travel && avail.indexOf(n.id)!==-1 && !n.visited;
    var isCurrent = state.currentNodeId===n.id;
    var cls='node-btn'+(isAvail?' available':'')+(n.visited?' visited':'')+(isCurrent?' current':'')+(n.type==='boss'?' boss':'')+((!isAvail&&!isCurrent)?' locked':'');
    return '<div class="'+cls+'" style="left:'+p.x+'px;top:'+p.y+'px;" '+(isAvail?'onclick="onEnterNode(\''+n.id+'\')"':'')+' title="'+nodeTitle(n)+'">'+NODE_ICONS[n.type]+'<span class="nb-lvl">Étage '+(n.layer+1)+'</span></div>';
  }).join('');
  var curPos = state.currentNodeId ? pos(m.byId[state.currentNodeId]) : L.startPos;
  var tokenStyle = 'left:'+curPos.x+'px;top:'+curPos.y+'px;';
  var tokenClass = 'party-token token-idle';
  if(travel){
    var dstPos = pos(m.byId[travel.toNodeId]);
    tokenStyle += '--dx:'+(dstPos.x-curPos.x)+'px;--dy:'+(dstPos.y-curPos.y)+'px;';
    tokenClass = 'party-token token-moving';
  }
  var tokenIcons = activeUnits(state).slice(0,4).map(function(u){return '<span style="color:'+roleColor(CLASSES[u.classId].role)+'">'+avatarSvg(u.classId)+'</span>';}).join('');
  var tokenHtml = '<div class="'+tokenClass+'" style="'+tokenStyle+'">'+tokenIcons+'</div>';
  return '<div class="wrap">'+
    '<div class="map-head"><h2>Carte de la Crypte</h2><div class="muted">'+(travel?'Votre compagnie se déplace…':'Choisissez la salle suivante parmi les chemins accessibles.')+'</div></div>'+
    '<div class="scroller"><div class="map-svg-wrap" style="height:'+L.svgH+'px;min-height:260px;">'+
    '<svg width="'+L.svgW+'" height="'+L.svgH+'" style="position:absolute;left:0;top:0;pointer-events:none;">'+lines+'</svg>'+
    nodesHtml+
    tokenHtml+
    '</div></div>'+
    '<div class="legend">'+Object.keys(NODE_ICONS).map(function(t){return '<span>'+NODE_ICONS[t]+' '+nodeTypeLabel(t)+'</span>';}).join('')+'</div>'+
    renderSynergyPanel()+
    '</div>';
}
function nodeTypeLabel(t){ return {combat:'Combat',elite:'Élite',merchant:'Marchand',event:'Évènement',camp:'Campement',boss:'Boss'}[t]; }
function nodeTitle(n){ return nodeTypeLabel(n.type)+' — Étage '+(n.layer+1); }
function renderSynergyPanel(){
  var syn = computeRoleSynergy(activeUnits(state));
  if(!syn.lines.length) return '';
  return '<div class="panel" style="margin-top:16px;"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:8px;">Synergies actives</h3><div class="synergy-box">'+syn.lines.map(function(l){return '<div class="synergy-line">✦ '+l+'</div>';}).join('')+'</div></div>';
}
function onEnterNode(nodeId){
  if(state.mapTravel) return;
  state.mapTravel = {toNodeId: nodeId};
  render();
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){ state.mapTravel = null; resolveNodeEntry(nodeId); }, reduced?0:520);
}
function resolveNodeEntry(nodeId){
  var node = state.mapNodes.byId[nodeId];
  node.visited = true; state.currentNodeId = nodeId; state.floor = node.layer;
  if(node.layer > (state.meta.bestFloor||0)){ state.meta.bestFloor = node.layer; saveMeta(state.meta); }
  if(node.type==='combat' || node.type==='elite' || node.type==='boss'){
    if(state.pendingAmbush){ state.pendingAmbush=false; }
    state.view='COMBAT'; startCombat(node); saveGame(); return;
  }
  if(node.type==='merchant'){ state.view='SHOP'; state.screen={offers:[rollLootItem(),rollLootItem(),rollLootItem(),generateFillerItem('trinket','common')]}; }
  else if(node.type==='event'){
    var pool = EVENTS.filter(function(e){ return true; });
    var ev = pool[Math.floor(Math.random()*pool.length)];
    state.view='EVENT'; state.screen={event:ev, outcome:null};
  } else if(node.type==='camp'){
    activeUnits(state).forEach(function(u){ var st=getStats(u,state); var missing=st.hp-(u.hp==null?st.hp:u.hp); u.hp=Math.min(st.hp,(u.hp==null?st.hp:u.hp)+Math.round(missing*0.25)); });
    state.view='CAMP'; state.screen={};
  }
  saveGame(); render();
}
function onBackToMap(){
  if(state.pendingAmbush){
    state.pendingAmbush=false;
    var node = state.mapNodes.byId[state.currentNodeId];
    state.view='COMBAT'; startCombat(Object.assign({},node,{type:'combat'})); saveGame(); render(); return;
  }
  state.view='MAP'; saveGame(); render();
}

/* ---- COMBAT VIEW ---- */
var PARTY_STAGE_POS = [ {x:36,y:62}, {x:58,y:62}, {x:22,y:84}, {x:72,y:84} ];
function enemyRowPositions(list, y){
  var n = list.length;
  return list.map(function(u,i){
    var x = n<=1 ? 50 : 26 + i*(48/(n-1));
    return {unit:u, x:x, y:y};
  });
}
function renderCombat(){
  var c = state.combat;
  var actor = currentActor();
  var fx = c.fx || {floaters:[],attackerUid:null,deaths:[]};
  var initHtml = c.queue.map(function(q,i){
    var u = findCombatant(q.uid,q.isEnemy);
    var chipColor = u.isEnemy? enemyColor(u) : roleColor(CLASSES[u.classId].role);
    var chipIcon = u.isEnemy? u.icon : u.classId;
    return '<div class="init-chip'+(i===c.qIndex?' now':'')+'" title="'+u.name+'" style="color:'+chipColor+'">'+avatarSvg(chipIcon)+'</div>';
  }).join('');

  var posByUid = {};
  var frontE = c.enemies.filter(function(e){return e.row==='front';});
  var backE = c.enemies.filter(function(e){return e.row==='back';});
  var enemySpots = enemyRowPositions(frontE, 38).concat(enemyRowPositions(backE, 16));
  enemySpots.forEach(function(s){ posByUid[s.unit.uid] = {x:s.x, y:s.y}; });
  c.party.forEach(function(p,i){ posByUid[p.uid] = PARTY_STAGE_POS[i] || {x:50,y:75}; });

  function spriteHtml(u, pos){
    var pct = Math.max(0,Math.round(u.hp/u.maxHp*100));
    var focusPct = u.focusMax? Math.round(u.focus/u.focusMax*100):0;
    var effs = u.tempEffects.map(function(e){ return '<span class="eff '+(['buffAc','buffAtk','buffSpd','shield','buffAtkSelf','buffMagSelf','buffAtkFromMag'].indexOf(e.type)!==-1?'buff':'debuff')+'">'+effLabel(e)+'</span>';}).join('');
    var isActing = actor && actor.uid===u.uid && u.hp>0 && !c.ended;
    var myFloaters = fx.floaters.filter(function(f){return f.uid===u.uid;});
    var isAttacker = fx.attackerUid===u.uid;
    var justDied = fx.deaths.indexOf(u.uid)!==-1;
    var hasDmg = myFloaters.some(function(f){return f.cls.indexOf('dmg')!==-1;});
    var hasHeal = myFloaters.some(function(f){return f.cls==='heal';});
    var animClass = '';
    if(justDied) animClass = ' dying';
    else if(isAttacker) animClass = (fx.attackAnim==='lunge') ? (u.isEnemy?' lunge-down':' lunge-up') : ' casting';
    else if(hasDmg) animClass = ' hit-flash';
    else if(hasHeal) animClass = ' heal-flash';
    var floatHtml = myFloaters.map(function(f,i){ return '<span class="floater '+f.cls+'" style="bottom:'+(100+i*20)+'%">'+f.text+'</span>'; }).join('');
    var color = u.isEnemy? enemyColor(u) : roleColor(CLASSES[u.classId].role);
    var iconKey = u.isEnemy? u.icon : u.classId;
    return '<div class="battle-sprite'+(u.hp<=0?' ko':'')+(isActing?' acting':'')+animClass+'" style="left:'+pos.x+'%;top:'+pos.y+'%;">'+
      avatarHtml(iconKey, color, 'avatar-battle')+
      floatHtml+
      '<div class="sprite-label"><span class="sprite-name">'+u.name+(u.level?' <span class="lvl">Nv.'+u.level+'</span>':'')+'</span>'+
      '<div class="mini-bar hp'+(pct<35?' low':'')+'"><i style="width:'+pct+'%"></i></div>'+
      '<div class="mini-caption mono">'+Math.max(0,u.hp)+'/'+u.maxHp+'</div>'+
      (u.isEnemy?'':'<div class="mini-bar focus"><i style="width:'+focusPct+'%"></i></div>')+
      (effs?'<div class="uc-effects">'+effs+'</div>':'')+
      '</div></div>';
  }
  var enemySprites = enemySpots.map(function(s){ return spriteHtml(s.unit, {x:s.x,y:s.y}); }).join('');
  var partySprites = c.party.map(function(p,i){ return spriteHtml(p, PARTY_STAGE_POS[i] || {x:50,y:75}); }).join('');
  var projectileHtml = '';
  if(fx.projectile && posByUid[fx.projectile.fromUid] && posByUid[fx.projectile.toUid]){
    var fp = posByUid[fx.projectile.fromUid], tp = posByUid[fx.projectile.toUid];
    projectileHtml = '<div class="projectile" style="--fx:'+fp.x+'%;--fy:'+fp.y+'%;--tx:'+tp.x+'%;--ty:'+tp.y+'%;"></div>';
  }
  var battleStage = '<div class="battle-stage">'+
    '<span class="stage-caption top">💀 Adversaires</span>'+
    '<span class="stage-caption bottom">🛡 Votre compagnie</span>'+
    enemySprites+partySprites+projectileHtml+
    '</div>';

  var playing = c.autoPlay && !c.ended;
  var fast = c.speed<=300;
  var lastLog = c.log.length ? c.log[c.log.length-1] : null;
  var turnLabel = (actor && !c.ended)
    ? (actor.isEnemy
        ? 'Au tour de <b>'+actor.name+'</b> (adversaire)'
        : 'Au tour de <b>'+actor.name+'</b>')
    : 'Combat terminé';
  var actionPanel = c.ended ? '' : '<div class="action-panel"><div class="ap-head"><span>⚔ <span class="mono">'+turnLabel+'</span></span>'+
    '<span class="muted">Round '+c.round+'</span></div>'+
    (lastLog ? '<div class="last-action-banner '+lastLog.cls+'">'+lastLog.text+'</div>' : '')+
    '<div class="ability-row">'+
    (playing ? '<button class="btn btn-sm" onclick="onPauseCombat()">⏸ Pause</button>' : '<button class="btn btn-sm btn-primary" onclick="onResumeCombat()">▶ Lecture</button>')+
    (!playing ? '<button class="btn btn-sm" onclick="onStepCombat()">⏭ Étape suivante</button>' : '')+
    '<button class="btn btn-sm" onclick="onToggleCombatSpeed()">'+(fast?'🐇 Rapide':'🐢 Normal')+'</button>'+
    '<button class="btn btn-sm btn-ghost" onclick="onSkipCombat()">⏩ Terminer le combat</button>'+
    '</div></div>';
  var logHtml = c.log.slice().reverse().map(function(l){return '<div class="log-line '+l.cls+'">'+l.text+'</div>';}).join('');
  return '<div class="wrap">'+
    '<div class="section-head"><h2>'+nodeTypeLabel(c.node.type)+' — Étage '+(c.node.layer+1)+'</h2><div class="muted">Votre compagnie combat automatiquement.</div></div>'+
    '<div class="init-strip"><span class="init-label">Ordre d\'action&nbsp;→</span>'+initHtml+'</div>'+
    battleStage+
    actionPanel+
    '<div class="log-panel">'+logHtml+'</div>'+
    '</div>';
}

function effLabel(e){
  var map={buffAc:'+CA',debuffAc:'-CA',buffAtk:'+ATT',debuffAtk:'-ATT',buffSpd:'+VIT',debuffSpd:'-VIT',stunActive:'Étourdi',shield:'Bouclier',weaken:'Affaibli',markDamage:'Marqué',debuffAcSelf:'-CA (soi)',buffAtkSelf:'+ATT (tourelle)',buffMagSelf:'+MAG (tourelle)',buffAtkFromMag:'Forme animale',dodge:'Esquive+'};
  return map[e.type]||e.type;
}

/* ---- REWARD ---- */
function renderReward(){
  var s = state.screen;
  if(s.levelUps.length > s.levelUpIndex){
    var lu = s.levelUps[s.levelUpIndex];
    var cls = CLASSES[lu.classId];
    return '<div class="wrap"><div class="panel"><h2 style="display:flex;align-items:center;gap:10px;">'+avatarHtml(lu.classId, roleColor(cls.role), 'avatar-md')+cls.name+' monte de niveau !</h2><p class="muted">Choisissez un talent permanent.</p>'+
      '<div class="talent-choice">'+lu.options.map(function(t){return '<div class="talent-card"><h4>'+t.name+'</h4><p>'+t.desc+'</p><button class="btn btn-primary btn-sm" onclick="onPickTalent(\''+lu.classId+'\',\''+t.id+'\')">Choisir</button></div>';}).join('')+
      '</div></div></div>';
  }
  var lootHtml = s.lootTaken ? '<p class="muted">Butin récupéré. Prêt à poursuivre.</p>' : ('<div class="item-grid">'+s.loot.map(function(it,i){return itemCard(it, '<button class="btn btn-sm btn-primary" onclick="onTakeLoot('+i+')">Prendre</button>');}).join('')+'</div>'+
    '<div style="margin-top:12px;"><button class="btn btn-ghost btn-sm" onclick="onSkipLoot()">Ignorer le butin (+15 or)</button></div>');
  return '<div class="wrap"><div class="panel">'+
    '<h2>'+(s.isBoss?'Victoire glorieuse !':'Salle nettoyée')+'</h2>'+
    '<div class="stat-row"><div><b>+'+s.goldGain+'</b><span>Or</span></div><div><b>+'+s.xpGain+'</b><span>Expérience</span></div></div>'+
    '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;">Butin proposé</h3>'+
    lootHtml+
    '<div style="margin-top:18px;"><button class="btn btn-primary" '+(s.lootTaken?'':'disabled')+' onclick="onContinueFromReward()">Continuer</button></div>'+
    '</div></div>';
}
function itemCard(it, actionsHtml){
  var stats = Object.keys(it.base||{}).map(function(k){return '+'+ (k==='critBonus'?Math.round(it.base[k]*100)+'% crit': it.base[k]+' '+k.toUpperCase());}).join(', ');
  return '<div class="item-card '+it.rarity+'"><div class="ic-head"><div><div class="ic-name">'+(it.icon||ITEM_ICONS[it.slot])+' '+it.name+'</div><div class="ic-rarity '+it.rarity+'">'+it.rarity+' · '+it.slot+'</div></div></div>'+
    (stats?'<div class="ic-stats">'+stats+'</div>':'')+
    (it.synText?'<div class="ic-syn">'+it.synText+'</div>':'')+
    (actionsHtml||'')+
    '</div>';
}
function onPickTalent(classId, talentId){
  var u = state.roster[classId];
  var t = TALENT_POOL.find(function(x){return x.id===talentId;});
  u.talents.push(Object.assign({},t,{id:t.id+'_'+Date.now()}));
  var st = getStats(u,state); if(u.hp!=null) u.hp = Math.min(st.hp, u.hp + (t.stat==='hp'?t.amount:0));
  state.screen.levelUpIndex++;
  saveGame(); render();
}
function onTakeLoot(idx){ state.inventory.push(state.screen.loot[idx]); state.screen.lootTaken=true; saveGame(); render(); }
function onSkipLoot(){ state.gold+=15; state.screen.lootTaken=true; saveGame(); render(); }
function onContinueFromReward(){
  if(state.screen.isBoss){ state.view='END'; state.screen={outcome:'victory', floor:state.floor}; clearSave(); render(); return; }
  state.view='MAP'; saveGame(); render();
}

/* ---- SHOP ---- */
function renderShop(){

    '</div></div>'+
    (state.inventory.length? '<div class="panel"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;">Vendre depuis votre sac</h3><div class="item-grid">'+sellables+'</div></div>':'')+

function onBuyItem(idx, price){

}
function onSellItem(idx, price){ state.gold+=price; state.inventory.splice(idx,1); saveGame(); render(); }
function onRerollShop(){ if(state.gold<8) return; state.gold-=8; state.screen.offers=[rollLootItem(),rollLootItem(),rollLootItem(),generateFillerItem('trinket','common')]; saveGame(); render(); }
function onBuyConsumable(kind,price){ if(state.gold<price) return; state.gold-=price; state.consumables[kind]=(state.consumables[kind]||0)+1; saveGame(); render(); }
