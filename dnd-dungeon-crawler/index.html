  var benchHtml = bench.length ? '<div class="bench-row">'+bench.map(function(u){
    return '<div class="form-slot" onclick="onCampSelectBench(\''+u.classId+'\')" style="min-width:120px;'+(state.screen.selBench===u.classId?'border-color:var(--accent);':'')+'">'+avatarHtml(u.classId, roleColor(CLASSES[u.classId].role), 'avatar-md')+'<b>'+CLASSES[u.classId].name+'</b><small>Réserve · Nv.'+u.level+'</small></div>';
  }).join('')+'</div>' : '<p class="muted">Aucun renfort en réserve pour l\'instant.</p>';
  var equipHtml = au.map(function(u){
    var st = getStats(u,state);
    return '<div class="panel" style="padding:14px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">'+avatarHtml(u.classId, roleColor(CLASSES[u.classId].role), 'avatar-sm')+'<b>'+CLASSES[u.classId].name+'</b></div>'+
      '<div class="cc-stats" style="margin:8px 0;"><div><b>'+st.hp+'</b>PV</div><div><b>'+st.ac+'</b>CA</div><div><b>'+st.atk+'</b>ATT</div><div><b>'+st.mag+'</b>MAG</div><div><b>'+st.spd+'</b>VIT</div></div>'+
      ['weapon','armor','trinket'].map(function(slotName){
        var it = u.equip[slotName];
        return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px;">'+
          '<span>'+ITEM_ICONS[slotName]+' '+(it?it.name:'— vide —')+'</span>'+
          (it?'<button class="btn btn-sm btn-ghost" onclick="onUnequip(\''+u.classId+'\',\''+slotName+'\')">Retirer</button>':'')+
          '</div>';
      }).join('')+
      '</div>';
  }).join('');
  var invHtml = state.inventory.length ? '<div class="item-grid">'+state.inventory.map(function(it,i){
    return itemCard(it, '<div class="slot-picker">'+au.map(function(u){ return '<button class="btn btn-sm" style="color:'+roleColor(CLASSES[u.classId].role)+'" onclick="onEquip('+i+',\''+u.classId+'\')">'+avatarSvg(u.classId)+'</button>';}).join('')+'</div>');
  }).join('')+'</div>' : '<p class="muted">Votre sac est vide.</p>';
  return '<div class="wrap"><div class="panel"><h2>🏕️ Campement</h2><p class="muted">Un repos vous a déjà rendu 25% des PV manquants. Réorganisez vos rangs, changez votre équipement, ou faites entrer un renfort.</p>'+
    '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:16px 0 8px;">Formation (cliquez deux emplacements pour les échanger)</h3>'+
    '<div class="formation-grid">'+slotHtml+'</div>'+
    '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:16px 0 8px;">Réserve (cliquez un renfort puis un emplacement)</h3>'+
    benchHtml+
    '</div>'+
    '<div class="panel"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;">Équipement de la compagnie</h3>'+equipHtml+'</div>'+
    '<div class="panel"><h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;">Sac ('+state.inventory.length+')</h3>'+invHtml+'</div>'+
    renderSynergyPanel()+
    '<button class="btn btn-primary" onclick="onBackToMap()">Continuer</button>'+
    '</div>';
}
function onCampSelectSlot(slot){
  var s = state.screen;
  if(s.selBench){
    var bu = state.roster[s.selBench];
    var au = activeUnits(state);
    var occupant = au.find(function(x){return x.slot===slot;});
    if(occupant) occupant.slot=null;
    bu.slot = slot;
    s.selBench=null; saveGame(); render(); return;
  }
  if(s.selSlot==null){ s.selSlot=slot; render(); return; }
  if(s.selSlot===slot){ s.selSlot=null; render(); return; }
  var au2 = activeUnits(state);
  var a = au2.find(function(x){return x.slot===s.selSlot;});
  var b = au2.find(function(x){return x.slot===slot;});
  if(a) a.slot=slot; if(b) b.slot=s.selSlot;
  if(a && !b) a.slot=slot;
  s.selSlot=null; saveGame(); render();
}
function onCampSelectBench(classId){ state.screen.selBench = (state.screen.selBench===classId)?null:classId; state.screen.selSlot=null; render(); }
function onEquip(invIdx, classId){
  var it = state.inventory[invIdx]; var u = state.roster[classId];
  if(u.equip[it.slot]) state.inventory.push(u.equip[it.slot]);
  u.equip[it.slot]=it; state.inventory.splice(invIdx,1);
  saveGame(); render();
}
function onUnequip(classId, slotName){
  var u = state.roster[classId];
  if(u.equip[slotName]){ state.inventory.push(u.equip[slotName]); u.equip[slotName]=null; }
  saveGame(); render();
}

/* ---- END ---- */
function renderEnd(){
  var s = state.screen;
  var victory = s.outcome!=='defeat';
  return '<div class="wrap"><div class="end-screen">'+
    '<div class="big">'+(victory?'🏆':'💀')+'</div>'+
    '<h1>'+(victory?'La Crypte est vaincue !':'Votre compagnie est tombée…')+'</h1>'+
    '<p class="muted" style="margin-top:8px;">'+(victory?'La Vouivre de Cendre s\'effondre en cendres. Votre légende grandit.':'Vous avez atteint l\'étage '+(s.floor+1)+' avant de succomber.')+'</p>'+
    '<div class="stat-row"><div><b>'+state.gold+'</b><span>Or amassé</span></div><div><b>'+Math.round(avgActiveLevel(state))+'</b><span>Niveau moyen</span></div><div><b>'+(state.meta.bestFloor||0)+'</b><span>Meilleur étage</span></div></div>'+
    '<button class="btn btn-primary" onclick="onRestartAfterEnd('+(victory?'true':'false')+')">'+(victory?'Nouvelle expédition (NG+'+((state.ngPlus||0)+1)+')':'Nouvelle expédition')+'</button>'+
    '</div></div>';
}
function onRestartAfterEnd(victory){
  var meta = loadMeta();
  if(victory){ meta.ngPlus=(meta.ngPlus||0)+1; saveMeta(meta); }
  clearSave();
  state = newState(); state.ngPlus = meta.ngPlus||0; state.buildPicks=[]; state.view='BUILD'; render();
}

/* ============================= INIT ============================= */
(function init(){
  var saved = loadGame();
  state = saved || newState();
  if(state.mapTravel) state.mapTravel = null;
  if(state.combat) state.combat.autoPlay = false;
  render();
})();
</script>
