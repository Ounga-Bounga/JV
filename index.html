<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ragdoll Battle 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div id="panel">
        <h1>Ragdoll Battle</h1>

        <div class="row">
          <label><span class="dot blue"></span>Equipe Bleue</label>
          <input type="number" id="countBlue" min="1" max="16" value="5" />
        </div>
        <div class="row">
          <label><span class="dot red"></span>Equipe Rouge</label>
          <input type="number" id="countRed" min="1" max="16" value="5" />
        </div>

        <div class="row buttons">
          <button id="btnStart">Lancer la bataille</button>
          <button id="btnReset">Reinitialiser</button>
        </div>

        <div class="row">
          <label>Vitesse</label>
          <input type="range" id="timeScale" min="0" max="200" value="100" />
        </div>
      </div>

      <div id="hud">
        <div class="team-hud blue">
          <div class="team-hud-top">
            <span class="team-name">Bleu</span>
            <span id="scoreBlue" class="team-count">5</span>
          </div>
          <div class="team-bar"><div id="hpBlue" class="team-bar-fill"></div></div>
        </div>
        <div class="team-hud red">
          <div class="team-hud-top">
            <span class="team-name">Rouge</span>
            <span id="scoreRed" class="team-count">5</span>
          </div>
          <div class="team-bar"><div id="hpRed" class="team-bar-fill"></div></div>
        </div>
      </div>

      <div id="banner"></div>

      <div id="help">
        <button id="helpToggle">?</button>
        <div id="helpBody">
          <strong>Camera libre</strong>
          <p>Clic gauche sur la scene : verrouille la souris</p>
          <p>ZQSD / WASD : deplacement</p>
          <p>Espace / Ctrl : monter / descendre</p>
          <p>Maj : acceleration</p>
          <p>Molette : vitesse de deplacement</p>
          <p>Echap : liberer la souris</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
