<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ragdoll Battle 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div id="panel">
        <h1>Ragdoll Battle</h1>

        <div class="row">
          <label>Equipe Bleue</label>
          <input type="number" id="countBlue" min="1" max="16" value="5" />
        </div>
        <div class="row">
          <label>Equipe Rouge</label>
          <input type="number" id="countRed" min="1" max="16" value="5" />
        </div>

        <div class="row buttons">
          <button id="btnStart">Lancer la bataille</button>
          <button id="btnReset">Reinitialiser</button>
        </div>

        <div class="row">
          <label>Vitesse</label>
          <input type="range" id="timeScale" min="0" max="200" value="100" />
        </div>
      </div>

      <div id="hud">
        <div id="scoreBlue" class="score blue">Bleu: 0</div>
        <div id="scoreRed" class="score red">Rouge: 0</div>
      </div>

      <div id="banner"></div>

      <div id="help">
        <button id="helpToggle">?</button>
        <div id="helpBody">
          <strong>Camera libre</strong>
          <p>Clic gauche sur la scene : verrouille la souris</p>
          <p>ZQSD / WASD : deplacement</p>
          <p>Espace / Ctrl : monter / descendre</p>
          <p>Maj : acceleration</p>
          <p>Molette : vitesse de deplacement</p>
          <p>Echap : liberer la souris</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
